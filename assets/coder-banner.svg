<svg viewBox="0 0 1200 260" width="100%" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050708"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fadeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="260" rx="14"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes fall {
        0%   { transform: translateY(-260px); }
        100% { transform: translateY(260px); }
      }
      .rain-col {
        animation-name: fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      @keyframes blinkCursor {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blinkCursor 1s steps(1) infinite;
      }
      @keyframes flicker {
        0%, 92%, 100% { opacity: 1; }
        94% { opacity: 0.85; }
        96% { opacity: 1; }
      }
      .term-text {
        animation: flicker 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="260" fill="url(#bgGrad)"/>

