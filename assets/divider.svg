<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 6" width="100%" height="6" role="img" aria-label="divider">
  <defs>
    <linearGradient id="shim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0F2027"/>
      <stop offset="45%"  stop-color="#2EA3F7"/>
      <stop offset="55%"  stop-color="#39FF88"/>
      <stop offset="100%" stop-color="#0F2027"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="6" rx="3" fill="url(#shim)"/>
</svg>
